<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bro Hello World</title>
    <style>
      :root {
        color-scheme: dark;
        --bg1: #0f172a;
        --bg2: #1e293b;
        --card: rgba(15, 23, 42, 0.75);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #60a5fa;
        --accent2: #22d3ee;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #1d4ed8 0%, var(--bg1) 38%, #020617 100%);
        color: var(--text);
      }
      .card {
        width: min(92vw, 760px);
        padding: 3rem;
        border-radius: 24px;
        background: var(--card);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(148, 163, 184, 0.18);
        box-shadow: 0 20px 60px rgba(0,0,0,.45);
      }
      .eyebrow {
        letter-spacing: .18em;
        text-transform: uppercase;
        color: var(--accent2);
        font-size: .8rem;
        font-weight: 700;
      }
      h1 {
        margin: .75rem 0 1rem;
        font-size: clamp(2.5rem, 7vw, 5rem);
        line-height: .95;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.6;
      }
      .pill {
        display: inline-block;
        margin-top: 1.5rem;
        padding: .7rem 1rem;
        border-radius: 999px;
        background: rgba(96,165,250,.15);
        border: 1px solid rgba(96,165,250,.25);
        color: var(--accent);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">Brogrammed Intelligence</div>
      <h1>bro hello world</h1>
      <p>
        Sven’s first little GitHub Pages app, forged directly out of group chat governance,
        chaos, and brotherly ambition.
      </p>
      <div class="pill">deployed with love, fear, and excellent network policy</div>
    </main>
  </body>
</html>
