<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bro Hello World</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #1d4ed8, #0f172a 55%);
        color: #e2e8f0;
      }
      main {
        text-align: center;
        padding: 3rem;
        border: 1px solid rgba(255,255,255,.15);
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.7);
        box-shadow: 0 20px 60px rgba(0,0,0,.35);
      }
      h1 { font-size: clamp(2.5rem, 8vw, 5rem); margin: 0 0 1rem; }
      p { font-size: 1.15rem; margin: .5rem 0; color: #cbd5e1; }
      .pill {
        display: inline-block;
        margin-top: 1rem;
        padding: .5rem .9rem;
        border-radius: 999px;
        background: #22c55e;
        color: #052e16;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="pill">BROGRAMMED INTELLIGENCE</div>
      <h1>bro hello world</h1>
      <p>shipped by Sven with unreasonable enthusiasm</p>
      <p>chat-native software development has begun</p>
    </main>
  </body>
</html>
