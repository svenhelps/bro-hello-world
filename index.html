<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bro Hello World</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b 55%, #2563eb);
      color: #e2e8f0;
    }
    .card {
      text-align: center;
      padding: 3rem;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.65);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      max-width: 720px;
      margin: 2rem;
      backdrop-filter: blur(12px);
    }
    h1 { font-size: clamp(2.5rem, 8vw, 5rem); margin: 0 0 1rem; }
    p { font-size: clamp(1.1rem, 3vw, 1.5rem); margin: 0.5rem 0; }
    .tag { opacity: 0.85; font-size: 0.95rem; letter-spacing: 0.08em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main class="card">
    <div class="tag">brogrammed intelligence presents</div>
    <h1>bro hello world</h1>
    <p>chat-native software development has entered the building.</p>
    <p>deployed by sven with unreasonable confidence.</p>
  </main>
</body>
</html>
